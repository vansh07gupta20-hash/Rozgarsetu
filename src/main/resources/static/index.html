<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RozgarSetu | Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #fff;

        .admin-link {
            color: #1769e0;
            text-decoration: none;
            font-weight: 600;
        }

        main {
            min-height: 75vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .hero {
            max-width: 650px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(32px, 5vw, 48px);
        }

        .description {
            max-width: 540px;
            margin: 0 auto 28px;
            color: #667085;
            font-size: 18px;
            line-height: 1.6;
        }

        .primary-button {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 9px;
            background: #1769e0;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        .primary-button:hover {
            background: #1056bd;
        }

        footer {
            padding: 20px;
            color: #667085;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

    <div class="brand">RozgarSetu</div>

            Find help for your home, quickly and conveniently.
        </p>

            Admin Login
        </a>
    </section>
</main>
