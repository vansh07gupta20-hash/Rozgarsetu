<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | RozgarSetu</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/login.js" defer></script>
</head>
<body>
<main class="page">
    <section class="login-card">
        <div class="brand-mark" aria-hidden="true">RS</div>
        <p class="eyebrow">ROZGARSETU</p>
        <h1>Admin login</h1>
        <p class="subtitle">Sign in to manage your platform.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@example.com"
                    autocomplete="username"
                    required
            >

            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
            >

            <p id="message" class="message" role="alert" aria-live="polite"></p>

            <button type="submit" id="loginButton">Sign in</button>
        </form>

        <a class="back-link" href="../index.html">Back to home</a>
    </section>
</main>
</body>
</html>
